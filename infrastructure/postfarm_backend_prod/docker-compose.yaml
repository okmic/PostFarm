# docker-compose.yml
version: '3.8'

services:
  backend:
    build:
      context: ../../services/app
      dockerfile: Dockerfile
    container_name: postfarm-backend
    restart: always
    ports:
      - "${PORT}:${PORT}"
      - "${AI_TEXT_GPT_PORT}:${AI_TEXT_GPT_PORT}"
    environment:
      - NODE_ENV=production
      - ADMIN_CLIENT_URI=${ADMIN_CLIENT_URI}
      - MOD=docker
      - PORT=${PORT}
      - ROOT_SECRET=${ROOT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_NAME=${MONGODB_NAME}
      - GATWAY_URI=${GATWAY_URI}
      - GATWAY_PORT=${GATWAY_PORT}
      - AI_TEXT_GPT_URI=${AI_TEXT_GPT_URI}
      - AI_TEXT_GPT_PORT=${AI_TEXT_GPT_PORT}
      - AI_TEXT_GPT_JWT_SECRET=${AI_TEXT_GPT_JWT_SECRET}
      - AI_TEXT_GPT_YANDEX_OAUTH_TOKEN=${AI_TEXT_GPT_YANDEX_OAUTH_TOKEN}
      - AI_TEXT_GPT_YANDEX_XFOLDER_ID=${AI_TEXT_GPT_YANDEX_XFOLDER_ID}
      - ROOT_USER_ID=${ROOT_USER_ID}
      - ROOT_USER_EMAIL=${ROOT_USER_EMAIL}
      - ROOT_USER_PSW=${ROOT_USER_PSW}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - postfarm-network

  mongo:
    image: mongo:7
    container_name: postfarm-mongo
    restart: always
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - postfarm-network

volumes:
  mongo-data:
    driver: local
  mongo-config:
    driver: local

networks:
  postfarm-network:
    driver: bridge